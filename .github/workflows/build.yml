name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          buildozer_version: stable
          workdir: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mustara-AI-APK
          path: bin/*.apk
          
